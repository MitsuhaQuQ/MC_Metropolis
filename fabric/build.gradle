architectury {
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration are bundled into the mod jar
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // In dev, Fabric Loader only reads resources from this mod's own output
    from(project(":common").sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    def refmap = project(":common").loom.mixin.defaultRefmapName.get()
    inputs.property "refmap", refmap
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The mixin config copied in above for dev wins over the one Architectury gave the refmap, which dev must not have
    // (Forge's dev run fails with it), so the jar gets it here
    filesMatching("citybuilder.mixins.json") {
        filter { line -> line.contains('"compatibilityLevel"') ? line + System.lineSeparator() + "  \"refmap\": \"${refmap}\"," : line }
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Mixins name methods by their Mojang names, which only exist in dev: in a real game they find their targets through the
// refmap their config names (see MTM_worldgen's CLAUDE.md: a jar without it starts in dev and crashes in a real game)
remapJar {
    doLast {
        def jar = zipTree(archiveFile.get().asFile)
        def config = new groovy.json.JsonSlurper().parse(jar.matching { include "citybuilder.mixins.json" }.singleFile)
        if (!config.refmap || jar.matching { include config.refmap }.isEmpty()) {
            throw new GradleException("${archiveFile.get().asFile.name}: citybuilder.mixins.json names no refmap in the jar")
        }
    }
}


dependencies {
    // MTM_worldgen in the dev client and server, so its terrain is there to build on
    modLocalRuntime files(rootProject.worldgenJar("fabric"))
    // MTR Advanced (logic and assets) with the Architectury API it needs
    modLocalRuntime files(rootProject.mtrJar("fabric", "MTM_Logic"), rootProject.mtrJar("fabric", "MTM_Assets"))
    modLocalRuntime "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
}

// TestKit: the automated in-game tests' interface to the dev test server (src/testkit, after MTR's MTM_TestKit). Its
// own source set, only on the dev server's classpath, never in the mod jar
sourceSets {
    testkit {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    runs {
        server {
            source sourceSets.testkit
        }
        // The test client in a directory of its own, so its log and options do not mix with the server's
        client {
            source sourceSets.testkit
            runDir "run-client"
        }
    }
}
