plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

def javaVersion = rootProject.java_version as int

// MTM_worldgen's mod jar for a loader, whatever its version: the one its own build last left in
// versions/<Minecraft version>/<loader>/build/libs (named mtm_worldgen-<loader>-<version>-<Minecraft version>.jar)
ext.worldgenJar = { String loader ->
    def mc = rootProject.minecraft_version
    def dir = file("${rootProject.mtm_worldgen_dir}/versions/${mc}/${loader}/build/libs")
    def prefix = "mtm_worldgen-${loader}-"
    def suffix = "-${mc}.jar"
    def jars = (dir.listFiles() ?: []).findAll { it.name.startsWith(prefix) && it.name.endsWith(suffix) }
    if (jars.isEmpty()) {
        throw new GradleException("No MTM_worldgen ${loader} jar for ${mc} in ${dir}. Build it in ${rootProject.mtm_worldgen_dir} " +
                "(gradlew :${mc}:${loader}:build), or set mtm_worldgen_dir")
    }
    return jars.max { it.lastModified() }
}

// An MTR Advanced jar for a loader, whatever its version: the newest MTR-merged-<loader>-<Minecraft version>-<mod>-*.jar
// in mtr_jar_dir, where <mod> is MTM_Logic (the mod's code) or MTM_Assets; server jars are left out
ext.mtrJar = { String loader, String mod ->
    def dir = file(rootProject.mtr_jar_dir)
    def prefix = "MTR-merged-${loader}-${rootProject.minecraft_version}-${mod}-"
    def jars = (dir.listFiles() ?: []).findAll { it.name.startsWith(prefix) && it.name.endsWith(".jar") && !it.name.endsWith("-server.jar") }
    if (jars.isEmpty()) {
        throw new GradleException("No MTR ${mod} jar (${prefix}*.jar) in ${dir}. Build MTR Advanced, or set mtr_jar_dir")
    }
    return jars.max { it.lastModified() }
}

// Every module: plain Java with the same toolchain
subprojects {
    apply plugin: "java"

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = javaVersion
    }
}

// The Minecraft modules: common and the loaders
configure(subprojects.findAll { it.name != "core" }) {
    apply plugin: "architectury-plugin"
    apply plugin: "dev.architectury.loom-remap"
    if (project.name != "common") {
        apply plugin: "com.gradleup.shadow"
    }

    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        // Architectury API, which MTR needs in dev runs
        maven { url = "https://maven.architectury.dev/" }
    }

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    // Jars carry the Minecraft version after the mod's own, as in citybuilder-fabric-0.0.1-1.20.1.jar
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = "${project.version}-${rootProject.minecraft_version}"
    }

    loom {
        silentMojangMappingsLicense()
        mixin {
            useLegacyMixinAp = true
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
    }
}
