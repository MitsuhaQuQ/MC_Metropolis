# Tests run concurrently within each test JVM: classes and their methods alike. Each test plans its towns in a
# world of its own (settlements are planned in the order they are needed, so a world shared between tests would plan
# differently by which ran first); the city logic is safe to use from many threads.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
# Threads per test JVM, as a share of the machine's cores (Gradle runs testForks JVMs, see core/build.gradle)
junit.jupiter.execution.parallel.config.dynamic.factor=0.5
