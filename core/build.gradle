// City logic: plain Java that knows nothing of Minecraft. common compiles these sources along with its own, so they
// ship inside every mod jar; tests run here, without starting the game
sourceSets {
    // The adapter onto MTM_worldgen's terrain logic: common compiles it too, the tests and tools use it here
    worldgen {
        java.srcDir "src/worldgen/java"
    }
    // Debug tools run from Gradle, never shipped: the city map
    tools {
        java.srcDir "src/tools/java"
    }
}

def worldgenJar = files(rootProject.worldgenJar("fabric"))

dependencies {
    // Settings read and write JSON with the Gson that Minecraft brings
    compileOnly "com.google.code.gson:gson:${rootProject.gson_version}"

    worldgenImplementation sourceSets.main.output
    worldgenImplementation worldgenJar

    toolsImplementation sourceSets.main.output
    toolsImplementation sourceSets.worldgen.output
    toolsImplementation worldgenJar
    toolsImplementation "com.google.code.gson:gson:${rootProject.gson_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Tests may run the city logic on real MTM terrain: MTM_worldgen's terrain logic is plain Java as well
    testImplementation sourceSets.worldgen.output
    testImplementation worldgenJar
    testImplementation "com.google.code.gson:gson:${rootProject.gson_version}"
    // The tools are tested too: the OSM statistics
    testImplementation sourceSets.tools.output
}

test {
    useJUnitPlatform()
    maxHeapSize = "4g"
}

// gradlew :core:cityMap -Pseed=12345 -Px=0 -Pz=0 -Pscale=16 [-Players=suitability|culture|settlements|extent|roads|spawn] [-Pjfr=file.jfr] [-Psize=1024] [-Pout=file.png]
tasks.register("cityMap", JavaExec) {
    group = "citybuilder"
    description = "Renders a layer of the city logic of an MTM_worldgen world to a PNG under build/debug"
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = "com.mtm.citybuilder.tools.CityMap"
    maxHeapSize = "6g"
    def seed = providers.gradleProperty("seed").getOrElse("12345")
    def x = providers.gradleProperty("x").getOrElse("0")
    def z = providers.gradleProperty("z").getOrElse("0")
    def scale = providers.gradleProperty("scale").getOrElse("16")
    def size = providers.gradleProperty("size").getOrElse("1024")
    def layer = providers.gradleProperty("layers").getOrElse("suitability")
    def out = providers.gradleProperty("out").getOrElse(
            layout.buildDirectory.file("debug/${layer}-${seed}_${x}_${z}_${scale}.png").get().asFile.path)
    args seed, x, z, scale, out, size, layer
    def threads = providers.gradleProperty("threads")
    if (threads.isPresent()) {
        systemProperty "java.util.concurrent.ForkJoinPool.common.parallelism", threads.get()
    }
    def worldgenCache = providers.gradleProperty("worldgenCache")
    if (worldgenCache.isPresent()) {
        systemProperty "worldgenCache", worldgenCache.get()
    }
    // -Pjfr=<file.jfr> records where the time goes, for `jfr print --events jdk.ExecutionSample`
    def jfr = providers.gradleProperty("jfr")
    if (jfr.isPresent()) {
        jvmArgs "-XX:FlightRecorderOptions:stackdepth=512", "-XX:StartFlightRecording=filename=${file(jfr.get()).absolutePath},settings=profile"
    }
}

// gradlew :core:terrainCost [-Pseed=12345]: what MTM_worldgen's queries cost the first time in a region and after
tasks.register("terrainCost", JavaExec) {
    group = "citybuilder"
    description = "Times MTM_worldgen's terrain queries as the city logic uses them"
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = "com.mtm.citybuilder.tools.TerrainCost"
    maxHeapSize = "6g"
    args providers.gradleProperty("seed").getOrElse("12345")
}

// gradlew :core:osmStats -Pin=<file.osm> [-Pbox="south west north east"]: statistics of a real town from OpenStreetMap,
// the targets the street layers are tuned against (data from OpenStreetMap, ODbL: statistics only, never shipped)
tasks.register("osmStats", JavaExec) {
    group = "citybuilder"
    description = "Street and settlement statistics of an OpenStreetMap extract"
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = "com.mtm.citybuilder.tools.OsmStats"
    maxHeapSize = "6g"
    def input = providers.gradleProperty("in")
    def box = providers.gradleProperty("box")
    if (input.isPresent()) {
        args([file(input.get()).absolutePath] + (box.isPresent() ? box.get().tokenize(" ") : []))
    }
}

// gradlew :core:railModels -Pin=<specs.json> -Pout=<dir>: bridges, viaducts and stations built from specs, as JSON for
// tools/assets/plateau_bridges.py build (structure templates and previews)
tasks.register("railModels", JavaExec) {
    group = "citybuilder"
    description = "Builds bridges, viaducts and stations from a list of specs"
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = "com.mtm.citybuilder.tools.RailModels"
    def input = providers.gradleProperty("in")
    def output = providers.gradleProperty("out")
    if (input.isPresent() && output.isPresent()) {
        args([file(input.get()).absolutePath, file(output.get()).absolutePath])
    }
}

// gradlew :core:templeModels -Pin=<specs.json> -Pout=<dir>: temple halls and pagodas built from specs, as JSON for
// tools/assets/plateau_voxel.py (structure templates and previews)
tasks.register("templeModels", JavaExec) {
    group = "citybuilder"
    description = "Builds temple models (halls, pagodas) from a list of specs"
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = "com.mtm.citybuilder.tools.TempleModels"
    def input = providers.gradleProperty("in")
    def output = providers.gradleProperty("out")
    if (input.isPresent() && output.isPresent()) {
        args([file(input.get()).absolutePath, file(output.get()).absolutePath])
    }
}
