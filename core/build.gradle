// City logic: plain Java that knows nothing of Minecraft. common compiles these sources along with its own, so they
// ship inside every mod jar; tests run here, without starting the game
dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
