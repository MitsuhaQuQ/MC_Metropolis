architectury {
    common(["fabric", "forge"])
}

// The city logic is compiled into common
sourceSets.main {
    java.srcDir rootProject.file("core/src/main/java")
    // The adapter onto MTM_worldgen's terrain logic, plain Java shared with core's tests and tools
    java.srcDir rootProject.file("core/src/worldgen/java")
    resources.srcDir rootProject.file("core/src/main/resources")
}

dependencies {
    // Only for the Mixin annotations; no Fabric API classes may be used in common
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}

dependencies {
    // MTM_worldgen, compiled against but not bundled: only code behind Platform.isModLoaded may touch it
    modCompileOnly files(rootProject.worldgenJar("fabric"))
    // MTR Advanced, the same way
    modCompileOnly files(rootProject.mtrJar("fabric", "MTM_Logic"))
}
