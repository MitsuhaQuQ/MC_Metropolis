org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Use locally installed JDKs only
org.gradle.java.installations.auto-download=false

# Project
mod_id=citybuilder
# Alpha from 0.0.1 (2026-11-22): each build handed out for testing raises the last number by one, tagged v<version>
mod_version=0.0.12-alpha
maven_group=com.mtm.citybuilder
archives_base_name=citybuilder

# Minecraft 1.20.1 only for now, as MTR Advanced builds 1.20.1 only. Same loader versions as MTM_worldgen's 1.20.1
minecraft_version=1.20.1
java_version=17
fabric_loader_version=0.16.10
fabric_api_version=0.92.2+1.20.1
forge_version=47.3.0

# Testing
junit_version=5.10.2

# MTM_worldgen (Realistic Landforms), compiled against straight from its built jars: build it there first
# (gradlew :1.20.1:fabric:build :1.20.1:forge:build); whichever version it built last is used. The game finds it at
# runtime only when it is installed, any version
mtm_worldgen_dir=../MTM_worldgen
gson_version=2.10.1

# MTR Advanced, compiled against straight from its built jars, whichever version is newest: the logic jar
# (MTR-merged-<loader>-1.20.1-MTM_Logic-<version>.jar) and, for dev runs, the assets jar (...-MTM_Assets-<version>.jar),
# as MTR's build round leaves them. The game finds it at runtime only when it is installed, any version
mtr_jar_dir=P:/mtr-ante/test-jars/merged
# MTR needs Architectury API at runtime; the version MTR builds against
architectury_api_version=9.2.14
# The SQLite driver MTM_worldgen carries (its gradle.properties), for the plan database in tests
sqlite_jdbc_version=3.49.1.0
